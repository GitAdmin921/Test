      const submitButton = document.getElementById("submit-button");
      const successPanel = document.getElementById("success-panel");
      const newRequestButton = document.getElementById("new-request-button");
      let sdkReady = false;
      let recordCount = 0;

      const handler = {
        onDataChanged(data) {
          recordCount = data.length;
        }
      };

      try {
        const initResult = await window.dataSdk.init(handler);
        sdkReady = initResult.isOk;
      } catch (_) {
        sdkReady = false;
      }

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        error.classList.add("hidden");

        if (!form.checkValidity()) {
          error.textContent = "Please complete your name, phone number, requested service, and preferred date.";
          error.classList.remove("hidden");
          form.reportValidity();
          return;
        }
        if (!sdkReady) {
          error.textContent = "We cannot send your appointment request right now. Please call us directly.";
          error.classList.remove("hidden");
          return;
        }
        if (recordCount >= 999) {
          error.textContent = "Appointment requests are temporarily at capacity. Please call us directly.";
          error.classList.remove("hidden");
          return;
        }

        submitButton.disabled = true;
        submitButton.classList.add("opacity-60", "cursor-not-allowed");

        const values = new FormData(form);
        const result = await window.dataSdk.create({
          patient_name: String(values.get("patient_name")).trim(),
          phone: String(values.get("phone")).trim(),
          email: String(values.get("email")).trim(),
          service: String(values.get("service")),
          preferred_date: String(values.get("preferred_date")),
          notes: String(values.get("notes")).trim(),
          created_at: new Date().toISOString()
        });

        submitButton.disabled = false;
        submitButton.classList.remove("opacity-60", "cursor-not-allowed");

        if (result.isOk) {
          form.classList.add("hidden");
          successPanel.classList.remove("hidden");
          lucide.createIcons();
        } else {
          error.textContent = "We could not send your request. Please try again or call us directly.";
          error.classList.remove("hidden");
        }
      });

      newRequestButton.addEventListener("click", () => {
        form.reset();
        successPanel.classList.add("hidden");
        form.classList.remove("hidden");
        document.getElementById("patient-name").focus();
      });
    });
  </script>
 </body>
</html>
