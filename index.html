  <script>
    document.addEventListener("DOMContentLoaded", function () {
      lucide.createIcons();
      const toggle = document.getElementById("menu-toggle");
      const menu = document.getElementById("mobile-menu");
      toggle.addEventListener("click", function () {
        const open = menu.classList.toggle("nav-open");
        toggle.setAttribute("aria-expanded", String(open));
      });
      menu.querySelectorAll("a").forEach(function(link) {
        link.addEventListener("click", function () {
          menu.classList.remove("nav-open");
          toggle.setAttribute("aria-expanded", "false");
        });
      });

      document.querySelectorAll(".path-option").forEach(function(button) {
        button.addEventListener("click", function () {
          const path = button.dataset.path;
          document.querySelectorAll(".path-option").forEach(function(item) {
            item.classList.toggle("active", item === button);
            item.setAttribute("aria-selected", String(item === button));
          });
          document.querySelectorAll(".path-panel").forEach(function(panel) {
            panel.classList.toggle("active", panel.id === path + "-panel");
          });
        });
      });
    });
  </script>
