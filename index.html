  <script src="/_sdk/0aac212797dcb9a6.editing_sdk.js" integrity="sha512-U1Z5TGB/MTX0fFSADhP7rVM3+UzJJjKTapiY1vm1cxcbcyWo4eBuCJNJO6zARJ5kHopP9UvWNtPszOqzRc1ICA=="></script>
  <script>
    const menuButton = document.getElementById("menu-button");
    const mobileMenu = document.getElementById("mobile-menu");
    const quoteForm = document.getElementById("quote-form");
    const quoteSubmit = document.getElementById("quote-submit");
    const formStatus = document.getElementById("form-status");
    let quoteSdkReady = false;

    function showFormStatus(message, isError) {
      formStatus.textContent = message;
      formStatus.classList.remove("hidden", "text-red-700", "text-green-700", "bg-red-50", "bg-green-50");
      formStatus.classList.add(isError ? "text-red-700" : "text-green-700", isError ? "bg-red-50" : "bg-green-50", "rounded-lg", "px-4", "py-3");
    }

    menuButton.addEventListener("click", () => {
      const isOpen = !mobileMenu.classList.contains("hidden");
      mobileMenu.classList.toggle("hidden");
      menuButton.setAttribute("aria-expanded", String(!isOpen));
    });

    document.querySelectorAll("#mobile-menu a").forEach(link => {
      link.addEventListener("click", () => {
        mobileMenu.classList.add("hidden");
        menuButton.setAttribute("aria-expanded", "false");
      });
    });

    const dataHandler = {
      onDataChanged() {
        // Quote requests are intentionally write-only for customer privacy.
      }
    };

    async function initializeQuotes() {
      if (!window.dataSdk) {
        showFormStatus("Quote requests are temporarily unavailable. Please call us on +64 21 121 6357.", true);
        return;
      }
      const result = await window.dataSdk.init(dataHandler);
      if (result.isOk) {
        quoteSdkReady = true;
      } else {
        showFormStatus("Quote requests are temporarily unavailable. Please call us on +64 21 121 6357.", true);
      }
    }

    quoteForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (!quoteSdkReady) {
        showFormStatus("Quote requests are still loading. Please try again in a moment.", true);
        return;
      }

      if (!quoteForm.checkValidity()) {
        quoteForm.reportValidity();
        return;
      }

      quoteSubmit.disabled = true;
      quoteSubmit.textContent = "Sending your quote request…";

      const formData = new FormData(quoteForm);
      const quote = {
        name: String(formData.get("name") || "").trim(),
        phone: String(formData.get("phone") || "").trim(),
        email: String(formData.get("email") || "").trim(),
        service_type: String(formData.get("service_type") || "").trim(),
        pickup_suburb: String(formData.get("pickup_suburb") || "").trim(),
        dropoff_suburb: String(formData.get("dropoff_suburb") || "").trim(),
        move_date: String(formData.get("move_date") || "").trim(),
        message: String(formData.get("message") || "").trim(),
        created_at: new Date().toISOString()
      };

      const result = await window.dataSdk.create(quote);

      quoteSubmit.disabled = false;
      quoteSubmit.textContent = "Request My Free Quote";

      if (result.isOk) {
        quoteForm.reset();
        showFormStatus("Thanks — your quote request has been sent. First Choice Movers will be in touch soon.", false);
      } else {
        showFormStatus("We could not send your request right now. Please call +64 21 121 6357 or email info@first-choicemovers.co.nz.", true);
      }
    });

    document.addEventListener("DOMContentLoaded", () => {
      lucide.createIcons();
      initializeQuotes();
    });
  </script>
